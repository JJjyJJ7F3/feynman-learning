name: validate-skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: SKILL.md frontmatter
        run: node .github/scripts/check-skill.mjs

      - name: Skill discovery
        run: |
          # The CLI version is pinned on purpose: the assertion below reads its
          # output format. Bump the pin, re-check the format, then keep this step.
          out="$(npx --yes skills@1.7.2 add . --list 2>&1)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'Found 1 skill' || { echo "::error::expected exactly one skill in this repository"; exit 1; }
          printf '%s\n' "$out" | grep -q 'feynman-learning' || { echo "::error::feynman-learning missing from discovery output"; exit 1; }
